<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KARIMUNKU TERANG - Pelaporan PJU Karimun</title>

    <!-- Favicon lambang Karimun -->
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d6/Seal_of_Karimun_Regency.svg/512px-Seal_of_Karimun_Regency.svg.png" type="image/png">

    <!-- Meta SEO -->
    <meta name="description" content="Sistem Pelaporan dan WebGIS Penerangan Jalan Umum (PJU) Kabupaten Karimun - Dinas Perumahan Rakyat dan Kawasan Permukiman">
    <meta name="theme-color" content="#f39c12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="KARIMUNKU TERANG">

    <!-- Open Graph — tampil bagus saat link dibagikan di WA/medsos/FB -->
    <meta property="og:title" content="KARIMUNKU TERANG">
    <meta property="og:description" content="Laporkan kerusakan lampu jalan di Kabupaten Karimun secara online, mudah dan cepat.">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d6/Seal_of_Karimun_Regency.svg/512px-Seal_of_Karimun_Regency.svg.png">
    <meta property="og:type" content="website">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%; width: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fff9ed;
            overflow: hidden;
        }

        /* ══════════════════════════════════════
           LOADING SCREEN
        ══════════════════════════════════════ */
        #loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(160deg, #fff9ed 0%, #fff3cd 60%, #fdebd0 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.55s ease;
        }
        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* Logo beranimasi */
        .ld-logo-ring {
            width: 90px; height: 90px;
            background: linear-gradient(135deg, #fff3cd, #fde68a);
            border-radius: 26px;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem;
            box-shadow: 0 8px 28px rgba(243,156,18,0.35);
            animation: ld-pulse 1.8s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes ld-pulse {
            0%,100% { transform: scale(1);    box-shadow: 0 8px 28px rgba(243,156,18,0.35); }
            50%      { transform: scale(1.07); box-shadow: 0 14px 36px rgba(243,156,18,0.55); }
        }

        .ld-title {
            font-size: 1.6rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, #d35400, #f39c12);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .ld-sub {
            font-size: 0.75rem; color: #92400e; font-weight: 600;
            text-align: center; line-height: 1.5;
            margin-bottom: 30px; padding: 0 24px;
        }

        /* Progress bar */
        .ld-bar-wrap {
            width: 220px; height: 6px;
            background: #fde68a; border-radius: 10px;
            overflow: hidden; margin-bottom: 12px;
        }
        .ld-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #f1c40f, #f39c12, #d35400);
            border-radius: 10px;
            animation: ld-fill 2.5s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        @keyframes ld-fill {
            0%   { width: 0%; }
            30%  { width: 45%; }
            70%  { width: 80%; }
            100% { width: 100%; }
        }

        .ld-caption {
            font-size: 0.7rem; color: #b45309; font-style: italic;
            animation: ld-blink 1.4s ease-in-out infinite;
        }
        @keyframes ld-blink {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.35; }
        }

        /* Teks badge bawah */
        .ld-badge {
            position: absolute; bottom: 20px;
            font-size: 0.65rem; color: #d97706;
            letter-spacing: 0.5px; text-align: center;
            font-weight: 600;
        }

        /* ══════════════════════════════════════
           APP IFRAME
        ══════════════════════════════════════ */
        #app-frame {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            border: none; display: block;
            opacity: 0;
            transition: opacity 0.65s ease;
        }
        #app-frame.loaded { opacity: 1; }
    </style>
</head>
<body>

    <!-- ── Loading screen ──────────────────────── -->
    <div id="loading-screen">
        <div class="ld-logo-ring">&#128161;</div>
        <div class="ld-title">KARIMUNKU TERANG</div>
        <div class="ld-sub">
            Sistem Pelaporan &amp; WebGIS PJU<br>
            Dinas Perumahan Rakyat dan Kawasan Permukiman Kabupaten Karimun
        </div>
        <div class="ld-bar-wrap">
            <div class="ld-bar"></div>
        </div>
        <div class="ld-caption" id="ld-caption-text">Memuat sistem...</div>
        <div class="ld-badge">&#127961; Pemerintah Kabupaten Karimun</div>
    </div>

    <!-- ── App (iframe ke GAS) ─────────────────── -->
    <!-- Ganti URL di bawah dengan URL GAS /exec Anda -->
    <iframe
        id="app-frame"
        src="https://script.google.com/macros/s/AKfycbz1gb46ksFlThUlP8LPdAt9er-w7dQL1WRqMOVKs8M1bBLClnljfQe7hCR6IddHTlTT/exec"
        allow="camera; geolocation; microphone; fullscreen"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true"
        onload="onAppLoaded()"
    ></iframe>

    <script>
        var _iframeReady = false;
        var _barReady    = false;
        var captions     = ['Memuat sistem...', 'Menghubungkan server...', 'Menyiapkan peta...', 'Hampir selesai...'];
        var capIdx       = 0;
        var capEl        = document.getElementById('ld-caption-text');

        // Ganti teks caption tiap 0.9 detik
        var capTimer = setInterval(function() {
            capIdx = (capIdx + 1) % captions.length;
            capEl.textContent = captions[capIdx];
        }, 900);

        // Bar selesai animasi setelah 2.6 detik
        setTimeout(function() {
            _barReady = true;
            tryReveal();
        }, 2600);

        // Dipanggil oleh onload iframe
        function onAppLoaded() {
            _iframeReady = true;
            tryReveal();
        }

        // Tampilkan app hanya jika iframe DAN bar sudah siap
        function tryReveal() {
            if (!_iframeReady || !_barReady) return;
            clearInterval(capTimer);
            var ls = document.getElementById('loading-screen');
            var fr = document.getElementById('app-frame');
            ls.classList.add('fade-out');
            fr.classList.add('loaded');
            setTimeout(function() { ls.style.display = 'none'; }, 600);
        }

        // Fallback: paksa tampil setelah 10 detik (jika iframe lambat)
        setTimeout(function() {
            _iframeReady = true;
            tryReveal();
        }, 10000);
    </script>

</body>
</html>
